<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Historique du stock</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { font-family: Arial; background:#f4f6f8; padding:10px; }
h1 { text-align:center; }
table { width:100%; border-collapse:collapse; background:white; font-size:13px; margin-top:10px; }
th, td { border:1px solid #ccc; padding:5px; text-align:center; }
th { background:#e67e22; color:white; }
tr:nth-child(even) { background:#f9f9f9; }
td.number { text-align:right; }
button { padding:8px; margin:5px; background:#2980b9; color:white; border:none; border-radius:5px; cursor:pointer; }
nav { text-align:center; margin-bottom:15px; }
</style>
<link rel="stylesheet" href="style.css">
</head>
<link rel="manifest" href="manifest.json">
<body>

<h1>📦 Historique du stock</h1>

<nav>
  <button onclick="location.href='index.html'">⬅️ Menu du jour</button>
  <button onclick="location.href='stock.html'">🏪 Gérer le stock</button>
</nav>

<table>
<thead>
<tr>
  <th>Date</th>
  <th>Produit</th>
  <th>Entrée (kg)</th>
  <th>Sortie (kg)</th>
  <th>Stock restant (kg)</th>
</tr>
</thead>
<tbody id="tableStock"></tbody>
</table>

<script>
let histo = JSON.parse(localStorage.getItem("historiqueStock")) || [];
let table = document.getElementById("tableStock");

if (histo.length === 0) {
  table.innerHTML = `<tr><td colspan="5">Aucun mouvement enregistré</td></tr>`;
} else {
  // Tri du plus récent au plus ancien
  histo.reverse().forEach(h => {
    table.innerHTML += `
      <tr>
        <td>${h.date}</td>
        <td>${h.produit}</td>
        <td class="number">${h.entree}</td>
        <td class="number">${h.sortie}</td>
        <td class="number">${h.restant}</td>
      </tr>
    `;
  });
}
</script>

</body>
</html>
